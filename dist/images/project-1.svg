<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f8e3e7"/>
  <!-- Grid lines suggesting a PCB / circuit board -->
  <line x1="0" y1="80"  x2="600" y2="80"  stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="160" x2="600" y2="160" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="0" y1="320" x2="600" y2="320" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="0" x2="100" y2="400" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="400" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="300" y1="0" x2="300" y2="400" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="400" y1="0" x2="400" y2="400" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <line x1="500" y1="0" x2="500" y2="400" stroke="#dac2b6" stroke-width="0.5" opacity="0.4"/>
  <!-- Circuit traces -->
  <polyline points="80,200 140,200 140,120 280,120 280,200 360,200" fill="none" stroke="#877369" stroke-width="2" opacity="0.5"/>
  <polyline points="360,200 440,200 440,280 520,280" fill="none" stroke="#877369" stroke-width="2" opacity="0.5"/>
  <!-- Component squares -->
  <rect x="120" y="110" width="20" height="20" rx="2" fill="#fecbcb" opacity="0.8"/>
  <rect x="260" y="110" width="20" height="20" rx="2" fill="#fecbcb" opacity="0.8"/>
  <rect x="340" y="190" width="20" height="20" rx="2" fill="#6c2f00" opacity="0.3"/>
  <rect x="500" y="270" width="20" height="20" rx="2" fill="#fecbcb" opacity="0.8"/>
  <!-- Chip -->
  <rect x="180" y="160" width="80" height="60" rx="4" fill="#ffffff" opacity="0.7" stroke="#dac2b6" stroke-width="1"/>
  <text x="300" y="370" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#877369" opacity="0.7" letter-spacing="2">[ Project photo ]</text>
</svg>
