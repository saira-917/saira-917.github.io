<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#fff0f2"/>
  <!-- Robotic arm segments (simplified geometric) -->
  <!-- Base -->
  <rect x="240" y="330" width="120" height="20" rx="4" fill="#dac2b6" opacity="0.8"/>
  <!-- Segment 1 -->
  <rect x="278" y="240" width="44" height="100" rx="6" fill="#f2dde1" stroke="#dac2b6" stroke-width="1.5"/>
  <!-- Joint 1 -->
  <circle cx="300" cy="240" r="16" fill="#ffffff" stroke="#dac2b6" stroke-width="2"/>
  <!-- Segment 2 (angled) -->
  <rect x="278" y="140" width="44" height="110" rx="6" fill="#fecbcb" opacity="0.7" stroke="#ecbaba" stroke-width="1.5"/>
  <!-- Joint 2 -->
  <circle cx="300" cy="140" r="14" fill="#ffffff" stroke="#dac2b6" stroke-width="2"/>
  <!-- Segment 3 (angled further) -->
  <line x1="300" y1="140" x2="370" y2="80" stroke="#f2dde1" stroke-width="30" stroke-linecap="round"/>
  <line x1="300" y1="140" x2="370" y2="80" stroke="#ecbaba" stroke-width="2" opacity="0.5"/>
  <!-- End effector -->
  <circle cx="370" cy="80" r="12" fill="#6c2f00" opacity="0.2" stroke="#6c2f00" stroke-width="1.5" opacity="0.4"/>
  <line x1="355" y1="70" x2="355" y2="90" stroke="#877369" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <line x1="385" y1="70" x2="385" y2="90" stroke="#877369" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <!-- Trajectory arc -->
  <path d="M 300 60 Q 380 20 420 80" fill="none" stroke="#dac2b6" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
  <text x="300" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#877369" opacity="0.7" letter-spacing="2">[ Project photo ]</text>
</svg>
