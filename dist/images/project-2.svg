<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fee9ed"/>
  <!-- Signal waveform lines -->
  <polyline points="20,150 60,150 80,80 100,220 120,80 140,220 160,150 200,150" fill="none" stroke="#6c2f00" stroke-width="2" opacity="0.35"/>
  <polyline points="200,150 240,150 260,100 280,200 300,100 320,200 340,150 380,150" fill="none" stroke="#7b5455" stroke-width="1.5" opacity="0.3"/>
  <!-- Baseline -->
  <line x1="0" y1="150" x2="400" y2="150" stroke="#dac2b6" stroke-width="0.5" opacity="0.5"/>
  <!-- Accent circles -->
  <circle cx="80"  cy="80"  r="5" fill="#fecbcb"/>
  <circle cx="120" cy="80"  r="5" fill="#fecbcb"/>
  <circle cx="260" cy="100" r="4" fill="#ecbaba" opacity="0.7"/>
  <circle cx="300" cy="100" r="4" fill="#ecbaba" opacity="0.7"/>
  <text x="200" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#877369" opacity="0.7" letter-spacing="2">[ Project photo ]</text>
</svg>
